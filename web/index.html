<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AisleTunes</title>
<meta name="theme-color" content="#0b2a5b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: one column — station label, cover art, song info, play button, recently played. */
:root{
  --bg:#0b2a5b; --bg2:#123a7a; --fg:#f4f7ff; --muted:#a9bde3; --line:rgba(169,189,227,.18);
  --accent:#ffc220; --accent-ink:#0b2a5b; --live:#ff5a4e;
  --display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%;margin:0}
body{
  background-color:var(--bg); color:var(--fg); font-family:var(--display);
  padding-block:max(24px, env(safe-area-inset-top,0px)) max(24px, env(safe-area-inset-bottom,0px));
  padding-left:max(16px, env(safe-area-inset-left,0px));
  padding-right:max(16px, env(safe-area-inset-right,0px));
  position:relative; overflow-x:hidden;
}
/* Blurred cover art washes the background */
#wash{position:fixed; inset:-10%; z-index:0; background:radial-gradient(120% 80% at 50% 20%, var(--bg2), var(--bg) 70%);
  background-size:cover; background-position:center; filter:blur(60px) saturate(1.3); opacity:.55; transition:background-image .8s}
#wash::after{content:""; position:absolute; inset:0; background:linear-gradient(180deg, rgba(11,42,91,.35), var(--bg) 85%)}
main{position:relative; z-index:1; max-width:420px; margin:0 auto; display:flex; flex-direction:column; align-items:center; gap:22px; text-align:center}
.eyebrow{font-family:var(--mono); font-size:12px; letter-spacing:.18em; text-transform:uppercase; color:var(--muted); margin:0; display:flex; align-items:center; gap:8px}
.dot{width:8px; height:8px; border-radius:50%; background:var(--muted)}
.eyebrow.on .dot{background:var(--live); box-shadow:0 0 10px var(--live)}
.eyebrow.on{color:var(--fg)}

.cover{width:min(78vw, 320px); max-width:100%; aspect-ratio:1; border-radius:14px; overflow:hidden; position:relative;
  background:var(--bg2); box-shadow:0 24px 60px rgba(0,0,0,.45)}
.cover img{width:100%; height:100%; object-fit:cover; display:block; transition:opacity .5s}
.cover .ph{position:absolute; inset:0; display:grid; place-items:center; padding:24px;
  background:linear-gradient(145deg, var(--bg2), var(--bg)); font-weight:800; font-size:28px; line-height:1.05; color:var(--accent); text-wrap:balance}

.info{display:flex; flex-direction:column; gap:4px; min-width:0; width:100%}
.title{font-size:clamp(22px, 6vw, 28px); font-weight:800; margin:0; line-height:1.15; text-wrap:balance; overflow-wrap:anywhere}
.artist{font-size:17px; font-weight:500; color:var(--fg); opacity:.9; margin:0; overflow-wrap:anywhere}
.album{font-family:var(--mono); font-size:12px; color:var(--muted); margin:2px 0 0; overflow-wrap:anywhere}

.controls{display:flex; flex-direction:column; align-items:center; gap:10px}
button{width:84px; height:84px; border:0; border-radius:50%; background:var(--accent); color:var(--accent-ink); cursor:pointer;
  display:grid; place-items:center; position:relative; box-shadow:0 12px 30px rgba(0,0,0,.35), inset 0 -4px 0 rgba(0,0,0,.12); transition:transform .15s}
button:hover{transform:scale(1.05)}
button:active{transform:scale(.96)}
button:focus-visible{outline:4px solid var(--fg); outline-offset:6px}
button svg{width:40%; height:40%}
button.playing::after{content:""; position:absolute; inset:-10px; border-radius:50%; border:3px solid var(--accent); animation:ring 1.8s ease-out infinite}
@keyframes ring{from{transform:scale(.92); opacity:.6} to{transform:scale(1.18); opacity:0}}
.status{font-family:var(--mono); font-size:12px; color:var(--muted); margin:0; min-height:1.4em}
#fallback{margin:0; font-family:var(--mono); font-size:13px}
#fallback a{color:var(--accent)}

.history{width:100%; text-align:left; border-top:1px solid var(--line); padding-top:16px}
.history h2{font-family:var(--mono); font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:var(--muted); margin:0 0 10px; font-weight:500}
.history ol{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:10px}
.history li{display:grid; grid-template-columns:44px 1fr auto; gap:12px; align-items:center}
.history img, .history .mini{width:44px; height:44px; border-radius:6px; object-fit:cover; background:var(--bg2)}
.history .t{font-size:15px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.history .a{font-size:13px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.history .txt{min-width:0}
.history time{font-family:var(--mono); font-size:11px; color:var(--muted); font-variant-numeric:tabular-nums}
.history .empty{font-size:13px; color:var(--muted)}
@media (prefers-reduced-motion:reduce){ button.playing::after{animation:none} button,#wash,.cover img{transition:none} }
</style>
</head>
<body>
<div id="wash"></div>
<main>
  <p class="eyebrow" id="eyebrow"><span class="dot"></span><span>Walmart &amp; Sam's Club Radio</span></p>

  <div class="cover">
    <img id="art" alt="" hidden>
    <div class="ph" id="ph">Walmart &amp; Sam's Club Radio</div>
  </div>

  <div class="info" aria-live="polite">
    <p class="title" id="title">Tuning the dial…</p>
    <p class="artist" id="artist">Waiting for the station to announce a song</p>
    <p class="album" id="album"></p>
  </div>

  <div class="controls">
    <button id="play" aria-label="Play radio">
      <svg id="icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"/></svg>
    </button>
    <p class="status" id="status">Tap to tune in</p>
    <p id="fallback" hidden>
      <a href="https://streams.radiomast.io/2ce0b08d-2fe6-42a1-b64a-9f0a682f5508" target="_blank" rel="noopener">Open the raw stream</a> ·
      <a href="https://tunein.com/radio/Walmart--Sams-Club-Radio-s349832" target="_blank" rel="noopener">TuneIn</a>
    </p>
  </div>

  <section class="history">
    <h2>Recently played</h2>
    <ol id="hist"><li class="empty">Songs will appear here as they air.</li></ol>
  </section>
</main>

<audio id="radio" preload="none"></audio>

<script>
const STREAM = "https://streams.radiomast.io/2ce0b08d-2fe6-42a1-b64a-9f0a682f5508";
const $ = id => document.getElementById(id);
const audio = $("radio"), btn = $("play"), icon = $("icon");
const PLAY = '<path d="M8 5.5v13l11-6.5z"/>';
const STOP = '<rect x="6.5" y="6.5" width="11" height="11" rx="1.5"/>';
let wanted = false, retries = 0;

/* ---------- Playback ---------- */
function setUI(state, msg){
  const on = state === "live";
  btn.classList.toggle("playing", on);
  $("eyebrow").classList.toggle("on", on);
  icon.innerHTML = wanted ? STOP : PLAY;
  btn.setAttribute("aria-label", wanted ? "Stop radio" : "Play radio");
  $("status").textContent = msg;
}
function start(){
  wanted = true;
  audio.src = STREAM;
  setUI("load", "Tuning in…");
  audio.play().catch(e => setUI("idle", "Couldn't start (" + (e && e.name || "error") + "). Tap again."));
}
function stop(){
  wanted = false; retries = 0;
  audio.pause(); audio.removeAttribute("src"); audio.load();
  setUI("idle", "Tap to tune in");
}
btn.addEventListener("click", () => wanted ? stop() : start());
audio.addEventListener("playing", () => { retries = 0; setUI("live", "On air"); });
audio.addEventListener("waiting", () => wanted && setUI("load", "Buffering…"));
audio.addEventListener("error", () => {
  if (!wanted) return;
  if (retries++ < 5){ setUI("load", "Reconnecting…"); setTimeout(start, 2000 * retries); }
  else {
    wanted = false;
    const codes = {1:"aborted",2:"network blocked",3:"decode failed",4:"format not supported"};
    setUI("idle", "Stream failed: " + (codes[audio.error && audio.error.code] || "unknown") + ". Tap to retry.");
    $("fallback").hidden = false;
  }
});
if ("mediaSession" in navigator){
  navigator.mediaSession.setActionHandler("play", start);
  navigator.mediaSession.setActionHandler("pause", stop);
  navigator.mediaSession.setActionHandler("stop", stop);
}

/* ---------- Now playing ---------- */
const artCache = new Map();
let current = "", history = [];

function splitMeta(s){
  const i = s.indexOf(" - ");
  return i > 0 ? { artist: s.slice(0, i).trim(), title: s.slice(i + 3).trim() } : { artist: "", title: s.trim() };
}

async function lookup(raw){
  if (artCache.has(raw)) return artCache.get(raw);
  let found = null;
  try {
    const q = encodeURIComponent(raw.replace(/\s*[\(\[].*?[\)\]]/g, "").replace(" - ", " "));
    const r = await fetch("https://itunes.apple.com/search?media=music&entity=song&limit=1&term=" + q);
    const j = await r.json();
    const t = j.results && j.results[0];
    if (t) found = { title: t.trackName, artist: t.artistName, album: t.collectionName,
      year: (t.releaseDate || "").slice(0, 4), art: t.artworkUrl100.replace("100x100bb", "600x600bb"),
      thumb: t.artworkUrl100 };
  } catch(e) {}
  artCache.set(raw, found);
  return found;
}

function showArt(url){
  const img = $("art");
  if (url){
    img.onload = () => { img.hidden = false; $("ph").hidden = true; };
    img.onerror = () => { img.hidden = true; $("ph").hidden = false; };
    img.src = url;
    $("wash").style.backgroundImage = "url('" + url + "')";
  } else {
    img.hidden = true; $("ph").hidden = false;
    $("wash").style.backgroundImage = "";
  }
}

function renderHistory(){
  const ol = $("hist");
  if (!history.length){ ol.innerHTML = '<li class="empty">Songs will appear here as they air.</li>'; return; }
  ol.innerHTML = "";
  history.forEach(h => {
    const li = document.createElement("li");
    const pic = h.thumb ? Object.assign(document.createElement("img"), { src: h.thumb, alt: "" })
                        : Object.assign(document.createElement("div"), { className: "mini" });
    const txt = document.createElement("div"); txt.className = "txt";
    const t = document.createElement("div"); t.className = "t"; t.textContent = h.title;
    const a = document.createElement("div"); a.className = "a"; a.textContent = h.artist || "—";
    txt.append(t, a);
    const tm = document.createElement("time");
    tm.textContent = h.at.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
    li.append(pic, txt, tm);
    ol.append(li);
  });
}

async function onMeta(raw){
  raw = (raw || "").trim();
  if (!raw || raw === current) return;
  // Push the previous song to history
  if (current){
    const prev = Object.assign({ at: new Date() }, nowInfo);
    history.unshift(prev); history = history.slice(0, 6); renderHistory();
  }
  current = raw;
  const base = splitMeta(raw);
  nowInfo = { title: base.title, artist: base.artist, thumb: "" };
  $("title").textContent = base.title || raw;
  $("artist").textContent = base.artist || "Walmart & Sam's Club Radio";
  $("album").textContent = "";
  showArt(null);

  const m = await lookup(raw);
  if (raw !== current) return; // song changed while we were looking
  if (m){
    nowInfo = { title: base.title || m.title, artist: base.artist || m.artist, thumb: m.thumb };
    $("album").textContent = [m.album, m.year].filter(Boolean).join(" · ");
    showArt(m.art);
  }
  document.title = nowInfo.title + " · AisleTunes";
  if ("mediaSession" in navigator){
    navigator.mediaSession.metadata = new MediaMetadata({
      title: nowInfo.title, artist: nowInfo.artist, album: "Walmart & Sam's Club Radio",
      artwork: m ? [{ src: m.art, sizes: "600x600", type: "image/jpeg" }] : []
    });
  }
}
let nowInfo = {};

function listen(){
  try {
    const es = new EventSource(STREAM + "/metadata");
    es.onmessage = e => {
      try { const d = JSON.parse(e.data); onMeta(d.metadata || d.title || ""); } catch(_) { onMeta(e.data); }
    };
    es.onerror = () => { if (!current) $("artist").textContent = "Song info unavailable right now"; };
  } catch(e) {
    $("artist").textContent = "Song info unavailable in this browser";
  }
}
listen();
</script>
</body>
</html>
