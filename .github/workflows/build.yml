name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Work out version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION_NAME=$(tr -d '[:space:]' < version.txt)" >> "$GITHUB_ENV"
          fi
          echo "VERSION_CODE=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Use private signing key if configured
        env:
          KEYSTORE_B64: ${{ secrets.AISLETUNES_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.AISLETUNES_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.AISLETUNES_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.AISLETUNES_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            {
              echo "AISLETUNES_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore"
              echo "AISLETUNES_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "AISLETUNES_KEY_ALIAS=$KEY_ALIAS"
              echo "AISLETUNES_KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
          fi

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/AisleTunes-${VERSION_NAME}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: AisleTunes-${{ env.VERSION_NAME }}
          path: out/*.apk

      - name: Attach APK to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" out/*.apk --clobber

      - name: Publish release for a new version.txt
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${VERSION_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG already released; APK kept as a build artifact."
          else
            gh release create "$TAG" out/*.apk --target "$GITHUB_SHA" \
              --title "AisleTunes $TAG" \
              --notes-file .github/release-notes.md
          fi

      - name: Publish release from tag
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/*.apk \
            --title "AisleTunes $GITHUB_REF_NAME" \
            --notes-file .github/release-notes.md
